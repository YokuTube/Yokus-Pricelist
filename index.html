<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#1b1916">
  <meta name="description" content="Preisliste und Befehle für den RICS-Chat: Items, Events, Wetter, Eigenschaften, Rassen – verständlich erklärt.">
  <title>Yokus Store</title>
  <link rel="stylesheet" href="assets/css/site.css">
  <script>
    /* Gespeichertes Design sofort anwenden (verhindert Aufblitzen) */
    try { if (localStorage.getItem('ys-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <svg class="emblem" width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 3l14 5v10c0 9-6 15-14 19C12 33 6 27 6 18V8z"/>
          <path d="M14 26l12-12M23 13l4 4M13 15c2-3 5-3 8-2"/>
        </svg>
        <div>
          <h1>Yokus Store</h1>
          <p>Was kann der Chat kaufen, auslösen und tun?</p>
        </div>
      </div>
      <div class="header-actions">
        <div id="chat-slot"></div>
        <div id="updated" class="updated"></div>
        <div class="stream-menu">
          <button type="button" id="stream-toggle" class="icon-btn" aria-haspopup="true" aria-expanded="false" aria-controls="stream-panel" title="Stream und Chat auf der Seite ein-/ausblenden">Stream</button>
          <div id="stream-panel" class="stream-panel" hidden></div>
        </div>
        <button type="button" id="theme-toggle" class="icon-btn" aria-label="Zum hellen Design wechseln">Hell</button>
      </div>
    </div>
  </header>

  <div class="tabs-bar">
    <div class="wrap">
      <nav class="tabs" id="tabs" role="tablist" aria-label="Bereiche"></nav>
    </div>
  </div>

  <main>
    <div class="wrap stream-dock-wrap"><div id="stream-dock" class="stream-dock" hidden></div></div>
    <div class="wrap" id="view" aria-live="polite"><div class="empty">Lade …</div></div>
  </main>

  <footer>
    <div class="wrap">
      Daten aus dem Spiel (RICS). Alle Preise in Coins. Mehr zu den Befehlen im
      <a href="https://github.com/ekudram/-cap-RimworldInteractiveChatServices/wiki/Commands" target="_blank" rel="noopener">RICS-Wiki</a>.
      Fan-Seite zu <em>RimWorld</em>, nicht mit Ludeon Studios verbunden.
    </div>
  </footer>

  <button type="button" id="to-top" class="to-top" aria-label="Nach oben">↑</button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><div class="wrap"><p class="warn">Diese Seite braucht JavaScript.</p></div></noscript>
  <script>
    /* Direkt von der Festplatte geöffnet (file://) geht nicht - Browser blockieren dort Module. */
    if (location.protocol === 'file:') {
      document.getElementById('view').innerHTML =
        '<div class="card"><h2>So öffnest du die Seite</h2><p>Diese Datei kann nicht direkt per Doppelklick geöffnet werden. ' +
        'Starte <code>tools\\preview.bat</code> (Doppelklick) – das öffnet sie lokal im Browser. Im Internet läuft sie über GitHub Pages ganz normal.</p></div>';
    }
  </script>
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
