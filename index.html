<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#1b1916">
  <meta name="description" content="Preisliste und Befehle für den RICS-Chat: Items, Events, Wetter, Eigenschaften, Rassen – verständlich erklärt.">
  <title>Yokus Store</title>
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="stylesheet" href="assets/css/stream.css">
  <link rel="stylesheet" href="assets/css/live-visual-a.css">
  <link rel="stylesheet" href="assets/css/cooldowns.css">
  <script>
    /* Gespeichertes Design sofort anwenden (verhindert Aufblitzen) */
    try { if (localStorage.getItem('ys-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <svg class="emblem" width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 3l14 5v10c0 9-6 15-14 19C12 33 6 27 6 18V8z"/>
          <path d="M14 26l12-12M23 13l4 4M13 15c2-3 5-3 8-2"/>
        </svg>
        <div>
          <h1>Yokus Store</h1>
          <p>Was kann der Chat kaufen, auslösen und tun?</p>
        </div>
      </div>
      <div class="header-actions">
        <div id="chat-slot"></div>
        <div id="updated" class="updated"></div>
        <div class="stream-menu">
          <button type="button" id="stream-toggle" class="icon-btn" aria-haspopup="true" aria-expanded="false" aria-controls="stream-panel" title="Stream und Chat auf der Seite ein-/ausblenden">Stream</button>
          <div id="stream-panel" class="stream-panel" hidden></div>
        </div>
        <button type="button" id="theme-toggle" class="icon-btn" aria-label="Zum hellen Design wechseln">Hell</button>
      </div>
    </div>
  </header>

  <div class="tabs-bar">
    <div class="wrap">
      <nav class="tabs" id="tabs" role="tablist" aria-label="Bereiche"></nav>
    </div>
  </div>

  <div class="wrap stream-dock-wrap" id="stream-wrap" hidden>
    <div class="stream-resizer" id="stream-resizer" role="separator" aria-orientation="vertical" aria-label="Breite von Stream und Chat ändern" tabindex="0" title="Ziehen: Breite ändern (Doppelklick: zurücksetzen)" hidden></div>
    <div class="stream-toolbar" id="stream-toolbar">
      <span class="stream-note">Chat schreiben: bei Twitch anmelden.</span>
      <a class="stream-popout" href="https://www.twitch.tv/popout/dasyoku/chat" target="_blank" rel="noopener">Chat in eigenem Fenster ↗</a>
      <span class="stream-pos" id="stream-pos" role="group" aria-label="Position von Stream und Chat" hidden>
        <button type="button" class="stream-tool stream-pos-btn" data-stream-pos="left" title="Stream und Chat links neben der Seite" aria-label="Links" aria-pressed="false">◧ <span>Links</span></button>
        <button type="button" class="stream-tool stream-pos-btn" data-stream-pos="top" title="Stream und Chat oben über der Seite" aria-label="Oben" aria-pressed="false">▭ <span>Oben</span></button>
        <button type="button" class="stream-tool stream-pos-btn" data-stream-pos="right" title="Stream und Chat rechts neben der Seite" aria-label="Rechts" aria-pressed="false">◨ <span>Rechts</span></button>
        <button type="button" class="stream-tool stream-pos-btn" data-stream-pos="bottom" title="Stream und Chat unten am Bildschirmrand" aria-label="Unten" aria-pressed="false">⬓ <span>Unten</span></button>
      </span>
      <span class="stream-pos stream-chatside" id="stream-chatside" role="group" aria-label="Wo der Chat steht" hidden>
        <button type="button" class="stream-tool stream-pos-btn" data-stream-chatside="left" title="Chat links neben dem Stream, volle Höhe" aria-pressed="false">◀ <span>Chat</span></button>
        <button type="button" class="stream-tool stream-pos-btn" data-stream-chatside="above" title="Chat über dem Stream" aria-pressed="false">▲ <span>Chat</span></button>
        <button type="button" class="stream-tool stream-pos-btn" data-stream-chatside="below" title="Chat unter dem Stream" aria-pressed="false">▼ <span>Chat</span></button>
        <button type="button" class="stream-tool stream-pos-btn" data-stream-chatside="right" title="Chat rechts neben dem Stream, volle Höhe" aria-pressed="false">▶ <span>Chat</span></button>
      </span>
      <button type="button" class="stream-tool" data-stream-chat-close title="Chat schließen">Chat ✕</button>
      <button type="button" class="stream-tool" data-stream-player-close title="Stream schließen">Stream ✕</button>
      <button type="button" class="stream-tool" data-stream-collapse title="Leiste einklappen (der Stream läuft klein weiter)">Einklappen ▴</button>
    </div>
    <div id="stream-dock" class="stream-dock" hidden></div>
    <button type="button" class="stream-strip" id="stream-strip" hidden><span class="stream-strip-text"></span><span aria-hidden="true">▾</span></button>
  </div>

  <main>
    <div class="wrap" id="view" aria-live="polite"><div class="empty">Lade …</div></div>
  </main>

  <footer>
    <div class="wrap">
      Daten aus dem Spiel (RICS). Alle Preise in Coins. Mehr zu den Befehlen im
      <a href="https://github.com/ekudram/-cap-RimworldInteractiveChatServices/wiki/Commands" target="_blank" rel="noopener">RICS-Wiki</a>.
      Fan-Seite zu <em>RimWorld</em>, nicht mit Ludeon Studios verbunden.
    </div>
  </footer>

  <button type="button" id="to-top" class="to-top" aria-label="Nach oben">↑</button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><div class="wrap"><p class="warn">Diese Seite braucht JavaScript.</p></div></noscript>
  <script>
    /* Direkt von der Festplatte geöffnet (file://) geht nicht - Browser blockieren dort Module. */
    if (location.protocol === 'file:') {
      document.getElementById('view').innerHTML =
        '<div class="card"><h2>So öffnest du die Seite</h2><p>Diese Datei kann nicht direkt per Doppelklick geöffnet werden. ' +
        'Starte <code>tools\\preview.bat</code> (Doppelklick) – das öffnet sie lokal im Browser. Im Internet läuft sie über GitHub Pages ganz normal.</p></div>';
    }
  </script>
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
